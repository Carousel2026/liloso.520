const shop = 'https://omnicrystal.store/shop/';
const tracking = '?utm_source=liloso&utm_medium=message';
const result = document.querySelector('#result');
const choices = [...document.querySelectorAll('[data-choice]')];
const status = document.querySelector('#copy-status');
document.querySelector('#shop-link').href = shop + tracking;

function select(choice, moveFocus) {
  const entry = Object.hasOwn(results, choice) ? results[choice] : null;
  choices.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.choice === choice)));
  result.hidden = !entry;
  status.textContent = '';
  if (!entry) return;
  document.querySelector('#picked').textContent = choice.toUpperCase() + ' · ' + entry.item;
  for (const [id, value] of Object.entries({
    'result-title': entry.title, story: entry.story, reflection: entry.reflection, today: entry.today, need: entry.need,
    'small-step': entry.step, 'product-title': entry.product, why: entry.why
  })) document.getElementById(id).textContent = value;
  const productUrl = shop + 'destiny-crystals/' + entry.path + tracking;
  document.querySelector('#product-link').href = productUrl;
  const photoLink = document.querySelector('#product-photo-link');
  const photo = document.querySelector('#product-photo');
  photoLink.href = productUrl;
  photoLink.hidden = false;
  photo.onerror = () => { photoLink.hidden = true; };
  photo.alt = '森靈水晶｜' + entry.product + '手鍊商品照';
  photo.src = entry.photo;
  if (moveFocus) result.focus();
}

choices.forEach(button => button.addEventListener('click', () => {
  const choice = button.dataset.choice;
  history.replaceState(null, '', '#' + choice);
  select(choice, true);
}));
window.addEventListener('hashchange', () => select(location.hash.slice(1).toLowerCase(), false));
document.querySelector('#again').addEventListener('click', event => {
  event.preventDefault();
  history.replaceState(null, '', '#choose');
  select('', false);
  choices[0].focus();
});
document.querySelector('#copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText('liloso');
    status.textContent = '已複製 liloso';
  } catch {
    const field = document.createElement('textarea');
    field.value = 'liloso';
    field.style.cssText = 'position:fixed;left:-9999px';
    document.body.append(field);
    field.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    field.remove();
    document.querySelector('#copy').focus();
    status.textContent = copied ? '已複製 liloso' : '可手動複製 liloso';
  }
});
select(location.hash.slice(1).toLowerCase(), false);
</script>
