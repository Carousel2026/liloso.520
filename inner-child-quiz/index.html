做」。只是長大後，這些念頭常常很快被忙碌和顧慮蓋過去。", "reflection": "妳可能對自己喜歡的事很有感覺，也容易在真正開始前想得很多。想學一樣東西，會先查資料，想到要花時間、可能做不好，又把頁面關掉。別人說一句「這有用嗎」，妳嘴上笑笑，心裡卻可能默默收起那份期待。", "today": "當生活只剩下該做的事，或身邊的人都在談成果和效率，妳會特別懷念以前那種做了就開心的感覺。妳可能已經很久沒有單純因為喜歡，就願意花一點時間試試看，連休息都想安排得很有意義。", "need": "妳心裡的小女孩，可能在等一句「想試就去試，我很想看看妳會做出什麼」。妳需要一點探索的空間，也需要容許自己的第一步普通、笨拙。興趣可以先屬於妳自己，慢慢長出它的樣子。", "step": "留十五分鐘，做一件一直想做的小事。畫一頁、拍一張照片、練幾個和弦都可以。完成後先問「剛剛哪裡讓我開心」，把那個感覺記下來。", "why": "這款手鍊的暖色光澤，很像童年塗鴉裡那顆大大的太陽。喜歡這種明亮配色的話，可以戴著它，提醒自己替好奇心留一點時間。", "product": "日月星辰", "path": "five-elements/a6/", "photo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCADhAJYDAREAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAgABAwQFBgcI/8QAOxAAAQMCBAQDBgMIAQUAAAAAAQACAwQRBRIhMQZBUWETInEHFDKBkaFCUsEVFiMzgrHR4UNTYnKy8P/EABsBAAIDAQEBAAAAAAAAAAAAAAABAgMEBQYH/8QALBEAAgIBBAEEAgICAgMAAAAAAAECAxEEEiExQQUTIlEyYRRxFUJSgSNDsf/aAAwDAQACEQMRAD8A+daLGaKMuMlIA47OHJYrKJvpm2u+C7Ro4liMWJ0sLaR/glgs6xtmVVUHW3uRZZJWL4s7Dgf2XMxTChiElWWGQaAFV36rnBZTp0lk1Kihq+FbRyFz4RtKFicVJ5NkZOKwbvCnGMWJONPG/Nbym5UJVOPJONqlwatc6joqoCOVtnC7xfZQab6Jxf2eXe0DjttSybCYGtLAbZl1dHpsfNnL1eozmCPNrLpnNGQA4agBWQArIAGyYCsgBAWQAgCgB8pQArAc0ANmA5IAFrbBIaEHODrMJv2SePI1nwe0ezfiikOCMoKifwZWG2pXE1NDcm0dfTXJRwze41wOqxLDHNpazMxzbhZYWqt4ZrlU7Ito87wHgziihbJWw2yNN7A6ldGd1U0c+FVsGNUYjiddNJTte+Oot5s9xZKFcI/JjlZOXxRw9WyVlTIyZ2Z7XEErqRxjg5ks55IrXUiI4bZAD3smA10AMgBb7IAcMQA+UBAAl3RADE3QAKAFlKANHEWU1LO9scLiwHQ9VkqlKazk1WRjB9FaHFRSvzR08d+6slVu7ZXG3b0jSw+vrHjxzTARZrkgLPOEVwnyX1zk+WuD0H9856PCYgwBxeAGi+y5ao3yZ0/f2R4N/BOI3xRxOmlaxtruaVF1PPBONqxyS1WI8L4wal7vCbKGkZxobq6KnF4KZbJRbPDsSZGyvqGxOzxh5ynqF3IfisnFn2yrZSIDIAZMB7IAcNJQAQFkANqgBiCgAQLIAnpqCoqz/Bhc+3ZJyS7JKLfSNKn4XrpT5w2IdyqJamuPkvjpbJeC7HwXKSc1QPkFnl6hBdGiPp032zIw2pikf4VVqLeX1VtsHHmBRVNP4yL0lJQQ0LpXQ/xybNAVMZWSljPBa4wjHOOSXBsQpZKCqpKqTwCGXYbblOypqSkuQrtTi0y/7PaGDGcVY2tnJjhNwwndQ1WYL4rslpsTfL6NX2qChoq2B const shop = 'https://omnicrystal.store/shop/';
const tracking = '?utm_source=liloso&utm_medium=message';
const result = document.querySelector('#result');
const choices = [...document.querySelectorAll('[data-choice]')];
const status = document.querySelector('#copy-status');
document.querySelector('#shop-link').href = shop + tracking;

function select(choice, moveFocus) {
  const entry = Object.hasOwn(results, choice) ? results[choice] : null;
  choices.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.choice === choice)));
  result.hidden = !entry;
  status.textContent = '';
  if (!entry) return;
  document.querySelector('#picked').textContent = choice.toUpperCase() + ' · ' + entry.item;
  for (const [id, value] of Object.entries({
    'result-title': entry.title, story: entry.story, reflection: entry.reflection, today: entry.today, need: entry.need,
    extra: entry.extra, 'small-step': entry.step, 'product-title': entry.product, why: entry.why
  })) document.getElementById(id).textContent = value;
  const productUrl = shop + 'destiny-crystals/' + entry.path + tracking;
  document.querySelector('#product-link').href = productUrl;
  const photoLink = document.querySelector('#product-photo-link');
  const photo = document.querySelector('#product-photo');
  photoLink.href = productUrl;
  photoLink.hidden = false;
  photo.onerror = () => { photoLink.hidden = true; };
  photo.alt = '森靈水晶｜' + entry.product + '手鍊商品照';
  photo.src = entry.photo;
  if (moveFocus) result.focus();
}

choices.forEach(button => button.addEventListener('click', () => {
  const choice = button.dataset.choice;
  history.replaceState(null, '', '#' + choice);
  select(choice, true);
}));
window.addEventListener('hashchange', () => select(location.hash.slice(1).toLowerCase(), false));
document.querySelector('#again').addEventListener('click', event => {
  event.preventDefault();
  history.replaceState(null, '', '#choose');
  select('', false);
  choices[0].focus();
});
document.querySelector('#copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText('liloso');
    status.textContent = '已複製 liloso';
  } catch {
    const field = document.createElement('textarea');
    field.value = 'liloso';
    field.style.cssText = 'position:fixed;left:-9999px';
    document.body.append(field);
    field.select();
    let copied = false;
    try { copied = document.execCommand('copy'); } catch {}
    field.remove();
    document.querySelector('#copy').focus();
    status.textContent = copied ? '已複製 liloso' : '可手動複製 liloso';
  }
});
select(location.hash.slice(1).toLowerCase(), false);
