<script>
const results = JSON.parse(document.getElementById('quiz-data').textContent);
const byId = id => document.getElementById(id);
const choices = byId('choose');
const panel = byId('result');

function render(focus = false) {
  const key = location.hash.slice(1).toUpperCase();
  const entry = Object.hasOwn(results, key) ? results[key] : null;
  choices.hidden = Boolean(entry);
  panel.hidden = !entry;
  if (!entry) {
    if (focus) document.querySelector('.pick').focus({preventScroll: true});
    if (focus && !location.hash) window.scrollTo(0, 0);
    return;
  }

  byId('result-pick').textContent = key + ' ｜ ' + entry.option;
  byId('result-title').textContent = entry.title;
  byId('result-deck').textContent = entry.deck;
  byId('reading').textContent = entry.reading;
  byId('need').textContent = entry.need;
  byId('example').textContent = entry.example;
  byId('action').textContent = entry.action;
  byId('quote').textContent = entry.quote;
  byId('gem').textContent = entry.gem;
  byId('stones').textContent = entry.stones;
  byId('gem-why').textContent = entry.why;
  byId('gem-img').src = entry.img;
  byId('gem-img').alt = entry.gem + '水晶手鍊';
  byId('product').href = entry.url;
  byId('copy-status').textContent = '';
  byId('others').replaceChildren(...Object.entries(results).filter(([letter]) => letter !== key).map(([letter, other]) => {
    const link = document.createElement('a');
    link.href = '#' + letter;
    link.className = 'other';
    link.textContent = letter + ' ' + other.short;
    return link;
  }));
  if (focus) {
    window.scrollTo(0, 0);
    byId('result-title').focus({preventScroll: true});
  }
}

byId('choices').addEventListener('click', event => {
  const choice = event.target.closest('[data-choice]');
  if (choice) location.hash = choice.dataset.choice;
});
window.addEventListener('hashchange', () => render(true));
byId('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText('liloso');
    byId('copy-status').textContent = '已複製折扣碼 liloso';
  } catch {
    byId('copy-status').textContent = '折扣碼是 liloso，可在結帳時手動輸入';
  }
});
render();
</script>
